  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 640px; margin: 48px auto; padding: 0 16px; color: #f3e6cf; font-family: sans-serif">
        <h1>Lethal Grid — Medieval Chain-Reaction Puzzle</h1>
        <p>
          Lethal Grid is a free puzzle game you play in your browser. Goblin raiders fill a castle
          courtyard. You get a few shots per stage, and every raider you fell can set off the next:
          powder-keg sappers explode, storm-rune shamans throw lightning down a row, and war-banner
          heralds boost every hit. Plan one shot that chains across the whole board.
        </p>
        <p>
          Between stages, spend gold in the Royal Forge to grow the courtyard from 3×3 to 8×8,
          unlock new weapons and train an archer garrison. Replay cleared stages for stars and
          chests, take on the Daily Siege, and earn Royal Crests for permanent upgrades.
        </p>
        <p>
          Please turn on JavaScript to play.
